# Seed keywords: the candidate products the pipeline tracks.
# Budget math for the SerpApi free tier (100 searches/month):
#   timeseries: 1 call per keyword, weekly  -> 15 kw * ~4.3 weeks = ~65
#   regions:    1 call per keyword, monthly -> 15 kw * 1          = ~15
#   total ~80/month, leaving headroom under the 90 hard-stop
# If you grow this list past ~18 keywords, lower the cadence or upgrade SerpApi.
seed_keywords:
  - mushroom lamp
  - sunset projection lamp
  - neck fan
  - magnetic phone mount
  - car trash can
  - posture corrector
  - electric spin scrubber
  - mini thermal printer
  - pet hair remover roller
  - ice roller face
  - heated eyelash curler
  - cordless water flosser
  - collapsible storage bins
  - led strip lights
  - portable blender

# Regions you care about targeting ads in. Used to filter/rank
# interest_by_region output; worldwide breakdown is always collected.
target_geos: [US, CA, GB, AU, DE]

# Collect US state-level breakdown (geo=US, one EXTRA SerpApi call per
# keyword per region cycle). Doubles the monthly region spend — leave off
# until the worldwide signal proves useful.
us_state_breakdown: false

# Scoring engine tuning (formula documented in src/trend_scout/scoring.py).
# Weights renormalize over available components, so they need not sum to 1
# exactly — but keep them proportional to how much you trust each signal.
scoring:
  weights:
    momentum: 0.5      # growth of interest (the core signal)
    regional: 0.3      # share of interest inside target_geos
    freshness: 0.2     # inverse saturation (how far past peak)
  momentum_windows: { "7": 0.5, "30": 0.3, "90": 0.2 }
  momentum_squash: 50.0        # tanh scale in % growth; lower = spikier scores
  saturation_stale_days: 45.0
  seasonality_min_days: 400    # below this span, seasonality is flag-only
  seasonality_ratio: 2.0
  min_days: 30                 # series shorter than this -> low confidence
  max_zero_ratio: 0.4          # more zeros than this -> low confidence
  low_confidence_factor: 0.6   # composite multiplier for low-confidence series

# Phase 3: the Claude analysis agent.
agent:
  model: claude-opus-4-8
  top_n: 10                    # how many top-scoring keywords to analyze per run
  # Cost guard, same pattern as the SerpApi budget: API *calls* per calendar
  # month, tracked in the shared api_quota ledger. One weekly run = 1 call
  # (~$0.35 at current Opus pricing); 20 leaves room for on-demand runs.
  monthly_call_budget: 20
  budget_reserve: 4
  # How much history context goes into the prompt
  feedback_history_limit: 30   # most recent feedback-marked recommendations
