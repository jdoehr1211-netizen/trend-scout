[project]
name = "trend-scout"
version = "0.1.0"
description = "Product trend collection and scoring pipeline for dropshipping research"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tenacity>=8.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pycountry>=24.6",
    "python-aliexpress-api>=3.0",
    "supabase>=2.6",
]

[project.scripts]
trend-scout = "trend_scout.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_scout"]
